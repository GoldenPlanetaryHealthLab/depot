[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "depot"
version = "0.0.1"
description = "Catalogs prospect datasets and makes them available across the Frontier."
authors = [
  { name = "GoldenPlanetaryHealthLab" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "frictionless>=5.18,<6",
    "jsonschema>=4.23,<5",
    "PyYAML>=6,<7",
    "rich>=13,<16",
]
requires-python = "~=3.14.0"

[project.scripts]
depot = "depot.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real DataLad/git-annex publication and retrieval"]

[tool.ruff]
line-length = 99
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["depot"]
force-sort-within-sections = true

